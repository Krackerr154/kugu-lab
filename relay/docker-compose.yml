# Deploy on Forge:  docker compose up -d --build
# Env comes from relay/.env (see .env.example). Do NOT commit .env.
services:
  kugu-m3-relay:
    build: .
    image: kugu-m3-relay:latest
    container_name: kugu-m3-relay
    restart: unless-stopped
    # Bind to loopback only; the host reverse proxy (openresty/Caddy) terminates
    # TLS and forwards WSS → this port. Never expose the raw WS port publicly.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      PRESENTER_TICKET: "${PRESENTER_TICKET}"
      ROOM_TTL_MS: "${ROOM_TTL_MS:-21600000}"
      MAX_MSG_BYTES: "${MAX_MSG_BYTES:-8192}"
      MAX_MSGS_PER_10S: "${MAX_MSGS_PER_10S:-60}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
